[project]
name = "project-euler"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "numba>=0.60.0",
    "numpy>=2.0.2",
    "pytest>=8.3.4",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.6.1",
    "requests>=2.32.3",
    "ruff>=0.9.3",
    "sympy>=1.13.3",
    "torch>=2.4.1",
    "torchaudio>=2.4.1",
    "torchvision>=0.19.1",
    "tqdm>=4.67.1",
]
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # missing-trailing-comma
  "T20",    # flake8-print
  "ERA",    # eradicate
  "D",      # docstrings
  "CPY",    # copyright
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "prek>=0.5.3",
    "ruff>=0.16.8",
    "ty>=0.0.82",
]
